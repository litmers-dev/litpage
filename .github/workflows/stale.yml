name: Stale

on:
  schedule:
    - cron: '17 3 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-message: 'This issue has been inactive for 30 days. Please add an update if it still needs attention.'
          stale-pr-message: 'This pull request has been inactive for 30 days. Please add an update if it still needs review.'
          close-issue-message: 'Closing this issue after 14 more days without activity. Thanks for raising it.'
          close-pr-message: 'Closing this pull request after 14 more days without activity. Thanks for contributing.'
